<!DOCTYPE html>
<html>
<head>
    <title>Hello World Test</title>
</head>
<body>
    <h1>Hello from Growth Hour!</h1>
    <p id="greeting">Click the button to say hello.</p>
    <button onclick="sayHello()">Say Hello</button>

    <script>
        const greetings = ["Hello, World!", "Hola, Mundo!", "Ciao, Mondo!", "Bonjour, le Monde!", "Hallo, Welt!"];
        let index = 0;

        function sayHello() {
            const message = greetings[index];
            document.getElementById("greeting").textContent = message;
            console.log(message);
            index = (index + 1) % greetings.length;
        }
    </script>
</body>
</html>
